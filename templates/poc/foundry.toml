[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Verbose traces are useful for PoCs; override on the CLI with -vvvv.

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# Add RPC endpoints here or use ETH_RPC_URL / --fork-url on the CLI.
[rpc_endpoints]
mainnet  = "${ETH_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
base     = "${BASE_RPC_URL}"
